server:
  port: 4004

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
#            http://localhost:4004/auth/login --> http://auth-service:4005/auth/login
            - id: auth-service-route
#              because the auth service is hosted on 4005 port
              uri: http://auth-service:4005
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: patient-service-route
              uri: http://patient-service:4000
#              what is allowed to pass through the gateway and to which microservice
              predicates:
                - Path=/api/patients/**
              filters:
#                it means it will ignore and strip the first part of the path for example "/api"
#                - StripPrefix=1
                - JwtValidation

            - id: api-docs-patient-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs



